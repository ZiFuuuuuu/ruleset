name: Build DAT for dae

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 防止 bot 提交的 [skip ci] 触发无限循环
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要写权限来 push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download & Convert Rules
        run: |
          python3 scripts/convert.py
          echo "--- 转换结果 ---"
          find data -type f | sort
          echo "--- 域名集合统计 ---"
          wc -l data/domains/*
          echo "--- IP 集合统计 ---"
          wc -l data/ips/*

      - name: Commit converted data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 只有真有变化时才提交，避免空 commit
          git diff --cached --quiet || git commit -m "chore: update converted rules data [skip ci]"
          git push

      - name: Build Domain DAT
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git dlc
          cp data/domains/* dlc/data/
          cd dlc
          go mod download
          go run ./
          mkdir -p ../dist
          cp dlc.dat ../dist/sukka-domain.dat
          echo "Domain DAT 大小: $(du -h ../dist/sukka-domain.dat | cut -f1)"

      - name: Build IP DAT
        run: |
          git clone --depth 1 https://github.com/v2fly/geoip.git geoip
          cp data/geoip-config.json geoip/config.json
          cd geoip
          go mod download
          go run ./
          mkdir -p ../dist
          cp sukka-ip.dat ../dist/
          echo "IP DAT 大小: $(du -h ../dist/sukka-ip.dat | cut -f1)"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sukka Rules for dae (latest)
          body: |
            自动构建的 SukkaW/ruleset.skk.moe 规则 DAT 文件，适用于 [dae](https://github.com/daeuniverse/dae)。

            **包含规则：**
            - `sukka-domain.dat` — 域名规则（来自 domainset + non_ip）
            - `sukka-ip.dat` — IP 规则（来自 ip）

            **使用方法：**
            ```dae
            domain(ext:"sukka-domain.dat:apple-cdn") -> direct
            dip(ext:"sukka-ip.dat:china-ip") -> direct
            ```
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
