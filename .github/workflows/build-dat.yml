name: Build DAT for dae

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'   # 每天北京时间 12:00 同步一次
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Fetch SukkaW/Surge
        run: |
          git clone --depth 1 https://github.com/SukkaW/Surge.git SukkaW-Surge
          echo "SukkaW/Surge 最新提交:"
          cd SukkaW-Surge && git log -1 --oneline

      - name: Convert Rules
        run: |
          python3 scripts/convert.py
          echo "--- 转换结果 ---"
          find data -type f | head -20

      - name: Build Domain DAT
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git dlc
          cp data/domains/* dlc/data/
          cd dlc
          go mod download
          go run ./
          mkdir -p ../dist
          cp dlc.dat ../dist/sukka-domain.dat
          echo "Domain DAT 大小: $(du -h ../dist/sukka-domain.dat | cut -f1)"

      - name: Build IP DAT
        run: |
          git clone --depth 1 https://github.com/v2fly/geoip.git geoip
          cp data/geoip-config.json geoip/config.json
          cd geoip
          go mod download
          go run ./
          mkdir -p ../dist
          cp sukka-ip.dat ../dist/
          echo "IP DAT 大小: $(du -h ../dist/sukka-ip.dat | cut -f1)"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sukka Rules for dae (latest)
          body: |
            自动构建的 SukkaW/Surge 规则 DAT 文件，适用于 [dae](https://github.com/daeuniverse/dae)。

            **包含规则：**
            - `sukka-domain.dat` — 域名规则（来自 domainset + non_ip）
            - `sukka-ip.dat` — IP 规则（来自 ip）

            **使用方法：**
            ```dae
            domain(ext:"sukka-domain.dat:apple_cdn") -> direct
            dip(ext:"sukka-ip.dat:china_ip") -> direct
            ```
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
