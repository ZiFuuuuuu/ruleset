name: Convert Sukka rules to dae rules

on:
  schedule:
    - cron: "0 0 */3 * *"

  workflow_dispatch:


jobs:

  convert:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Python
      run: |
        python -m pip install requests


    - name: Convert rules
      run: |
        python convert.py


    - name: Commit update
      run: |

        git config user.name github-actions

        git config user.email actions@github.com

        git add output

        git commit -m "Update dae rules" || true

        git push
