name: Convert Surge Rules to daed Format

on:
  push:
    branches: [ main, master ]
    paths:
      - 'List/**'
  schedule:
    - cron: '0 3 */3 * *' # 每 3 天 UTC 3:00 自动运行
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  actions: write # 删除历史运行记录所需的权限

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run conversion script
        run: python convert_to_dae.py

      - name: Commit and push converted rules
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update converted daed rulesets"
          file_pattern: "daed_List/**"
          branch: ${{ github.ref_name }}

      - name: Delete old workflow runs (older than 15 days)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 15
          keep_minimum_runs: 3 # 保留最少的记录数量，避免全部删空
