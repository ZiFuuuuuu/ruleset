name: Convert Surge -> dae

on:

  workflow_dispatch:

  schedule:
    - cron: "0 0 */3 * *"

permissions:
  contents: write

jobs:

  convert:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run converter
        run: |
          python convert.py

      - name: Commit
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add output

          git diff --cached --quiet && exit 0

          git commit -m "Auto Convert"

          git push
